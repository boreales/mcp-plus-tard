[project]
name = "plus-tard-mcp"
version = "0.1.0"
description = "MCP server exposing Plus Tard social media scheduling API to AI agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "mcp[fastapi]>=1.2.0,<2",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
