services:
  mcp:
    build: .
    container_name: plus-tard-mcp
    restart: unless-stopped
    env_file: .env
    # Bind to localhost only — Nginx will proxy from the public domain.
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
